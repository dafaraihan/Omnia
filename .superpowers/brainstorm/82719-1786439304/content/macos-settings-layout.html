<div id="omnia-settings-comparison">
  <style>
    #omnia-settings-comparison {
      --omnia-desktop: light-dark(#d7dde5, #15181d);
      --omnia-window: light-dark(#f3f3f5, #242426);
      --omnia-toolbar: light-dark(#e9e9eb, #2d2d2f);
      --omnia-sidebar: light-dark(#e6e8eb, #292b2f);
      --omnia-pane: light-dark(#f6f6f7, #202022);
      --omnia-row: light-dark(#ffffff, #303033);
      --omnia-row-hover: light-dark(#eef4fb, #343c47);
      --omnia-text: light-dark(#17171a, #f2f2f3);
      --omnia-secondary: light-dark(#66666d, #b3b3ba);
      --omnia-divider: light-dark(#d4d4d8, #454549);
      --omnia-accent: light-dark(#0a6adf, #2997ff);
      color: var(--omnia-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    #omnia-settings-comparison .omnia-heading { margin-bottom: 18px; }
    #omnia-settings-comparison .omnia-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    #omnia-settings-comparison .omnia-choice { appearance: none; display: flex; flex-direction: column; gap: 0; width: 100%; padding: 0; overflow: hidden; text-align: left; color: inherit; background: transparent; border: 1px solid var(--omnia-divider); border-radius: 14px; cursor: pointer; }
    #omnia-settings-comparison .omnia-choice:hover { border-color: var(--omnia-accent); }
    #omnia-settings-comparison .omnia-choice.selected { box-shadow: 0 0 0 3px color-mix(in srgb, var(--omnia-accent) 34%, transparent); border-color: var(--omnia-accent); }
    #omnia-settings-comparison .omnia-preview { min-height: 390px; padding: 18px; background: var(--omnia-desktop); }
    #omnia-settings-comparison .omnia-window { height: 354px; overflow: hidden; border: 1px solid var(--omnia-divider); border-radius: 12px; background: var(--omnia-window); box-shadow: 0 12px 32px color-mix(in srgb, var(--omnia-text) 16%, transparent); }
    #omnia-settings-comparison .omnia-titlebar { position: relative; display: flex; align-items: center; justify-content: center; height: 42px; border-bottom: 1px solid var(--omnia-divider); background: var(--omnia-toolbar); }
    #omnia-settings-comparison .omnia-lights { position: absolute; left: 12px; display: flex; gap: 7px; }
    #omnia-settings-comparison .omnia-light { width: 10px; height: 10px; border-radius: 50%; background: var(--omnia-secondary); opacity: .52; }
    #omnia-settings-comparison .omnia-title { font-weight: 500; }
    #omnia-settings-comparison .omnia-toolbar-tabs { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px 10px; border-bottom: 1px solid var(--omnia-divider); background: var(--omnia-toolbar); }
    #omnia-settings-comparison .omnia-tab { display: grid; justify-items: center; gap: 3px; min-width: 52px; padding: 5px 7px; color: var(--omnia-secondary); border-radius: 7px; }
    #omnia-settings-comparison .omnia-tab svg { width: 17px; height: 17px; }
    #omnia-settings-comparison .omnia-tab span { font-size: 10px; }
    #omnia-settings-comparison .omnia-tab-active { color: var(--omnia-text); background: var(--omnia-row); }
    #omnia-settings-comparison .omnia-centered-pane { max-width: 470px; margin: 0 auto; padding: 18px 22px 22px; }
    #omnia-settings-comparison .omnia-section-title { margin: 0 0 6px 3px; color: var(--omnia-secondary); font-size: 11px; font-weight: 500; }
    #omnia-settings-comparison .omnia-group { overflow: hidden; border: 1px solid var(--omnia-divider); border-radius: 9px; background: var(--omnia-row); }
    #omnia-settings-comparison .omnia-row { display: grid; grid-template-columns: 19px minmax(0, 1fr) auto 12px; align-items: center; gap: 8px; min-height: 37px; padding: 0 10px; border-bottom: 1px solid var(--omnia-divider); }
    #omnia-settings-comparison .omnia-row:last-child { border-bottom: 0; }
    #omnia-settings-comparison .omnia-row svg { width: 15px; height: 15px; color: var(--omnia-accent); }
    #omnia-settings-comparison .omnia-summary { color: var(--omnia-secondary); font-size: 10px; }
    #omnia-settings-comparison .omnia-chevron { color: var(--omnia-secondary); font-size: 14px; }
    #omnia-settings-comparison .omnia-app-shell { display: grid; grid-template-columns: 108px minmax(0, 1fr); height: 311px; }
    #omnia-settings-comparison .omnia-app-sidebar { padding: 12px 8px; border-right: 1px solid var(--omnia-divider); background: var(--omnia-sidebar); }
    #omnia-settings-comparison .omnia-side-item { display: flex; align-items: center; gap: 7px; padding: 7px 8px; margin-bottom: 2px; border-radius: 6px; color: var(--omnia-secondary); font-size: 11px; }
    #omnia-settings-comparison .omnia-side-item svg { width: 14px; height: 14px; }
    #omnia-settings-comparison .omnia-side-active { color: var(--omnia-text); background: var(--omnia-accent); }
    #omnia-settings-comparison .omnia-integrated { overflow: auto; background: var(--omnia-pane); }
    #omnia-settings-comparison .omnia-integrated-head { display: flex; align-items: center; justify-content: space-between; max-width: 440px; margin: 0 auto; padding: 17px 20px 10px; }
    #omnia-settings-comparison .omnia-integrated-head strong { font-size: 18px; }
    #omnia-settings-comparison .omnia-search { display: flex; align-items: center; gap: 5px; width: 128px; padding: 5px 8px; color: var(--omnia-secondary); border: 1px solid var(--omnia-divider); border-radius: 7px; background: var(--omnia-row); font-size: 10px; }
    #omnia-settings-comparison .omnia-search svg { width: 12px; height: 12px; }
    #omnia-settings-comparison .omnia-integrated .omnia-centered-pane { max-width: 440px; padding-top: 3px; }
    #omnia-settings-comparison .omnia-choice-copy { display: block; width: 100%; padding: 15px 16px 17px; border-top: 1px solid var(--omnia-divider); background: var(--omnia-window); }
    #omnia-settings-comparison .omnia-choice-copy strong { display: block; margin-bottom: 5px; }
    #omnia-settings-comparison .omnia-choice-copy span { color: var(--omnia-secondary); }
    #omnia-settings-comparison .omnia-recommended { color: var(--omnia-accent); font-weight: 500; }
    @media (max-width: 760px) {
      #omnia-settings-comparison .omnia-choices { grid-template-columns: 1fr; }
    }
  </style>

  <div class="omnia-heading">
    <h2>Choose the macOS Settings structure</h2>
    <p class="subtitle">Both remove the edge-to-edge rows. Click the layout you want Omnia to use.</p>
  </div>

  <div class="omnia-choices">
    <button type="button" class="omnia-choice" data-choice="a-native-settings-window" onclick="toggleSelect(this)">
      <div class="omnia-preview">
        <div class="omnia-window">
          <div class="omnia-titlebar">
            <div class="omnia-lights"><span class="omnia-light"></span><span class="omnia-light"></span><span class="omnia-light"></span></div>
            <span class="omnia-title">Media</span>
          </div>
          <div class="omnia-toolbar-tabs">
            <div class="omnia-tab"><i data-lucide="user-round" aria-hidden="true"></i><span>Account</span></div>
            <div class="omnia-tab omnia-tab-active"><i data-lucide="clapperboard" aria-hidden="true"></i><span>Media</span></div>
            <div class="omnia-tab"><i data-lucide="play" aria-hidden="true"></i><span>Playback</span></div>
            <div class="omnia-tab"><i data-lucide="monitor" aria-hidden="true"></i><span>App</span></div>
            <div class="omnia-tab"><i data-lucide="info" aria-hidden="true"></i><span>About</span></div>
          </div>
          <div class="omnia-centered-pane">
            <p class="omnia-section-title">MEDIA</p>
            <div class="omnia-group">
              <div class="omnia-row"><i data-lucide="puzzle" aria-hidden="true"></i><span>Add-ons</span><span class="omnia-summary">2 enabled</span><span class="omnia-chevron">›</span></div>
              <div class="omnia-row"><i data-lucide="layers-3" aria-hidden="true"></i><span>Catalogs</span><span class="omnia-summary">Built-in + add-on</span><span class="omnia-chevron">›</span></div>
              <div class="omnia-row"><i data-lucide="panels-top-left" aria-hidden="true"></i><span>Metadata</span><span class="omnia-summary">Providers</span><span class="omnia-chevron">›</span></div>
              <div class="omnia-row"><i data-lucide="history" aria-hidden="true"></i><span>Progress</span><span class="omnia-summary">On this Mac</span><span class="omnia-chevron">›</span></div>
              <div class="omnia-row"><i data-lucide="calendar-days" aria-hidden="true"></i><span>Upcoming</span><span class="omnia-summary">Shown on Home</span><span class="omnia-chevron">›</span></div>
            </div>
          </div>
        </div>
      </div>
      <span class="omnia-choice-copy">
        <strong>A. Dedicated Settings window <span class="omnia-recommended">— Apple HIG</span></strong>
        <span>Command–Comma opens a compact, noncustomizable window. Toolbar buttons switch root panes; deeper pages retain native Back.</span>
      </span>
    </button>

    <button type="button" class="omnia-choice" data-choice="b-integrated-centered-pane" onclick="toggleSelect(this)">
      <div class="omnia-preview">
        <div class="omnia-window">
          <div class="omnia-titlebar">
            <div class="omnia-lights"><span class="omnia-light"></span><span class="omnia-light"></span><span class="omnia-light"></span></div>
            <span class="omnia-title">Omnia</span>
          </div>
          <div class="omnia-app-shell">
            <aside class="omnia-app-sidebar">
              <div class="omnia-side-item"><i data-lucide="search" aria-hidden="true"></i><span>Search</span></div>
              <div class="omnia-side-item"><i data-lucide="house" aria-hidden="true"></i><span>Home</span></div>
              <div class="omnia-side-item"><i data-lucide="library" aria-hidden="true"></i><span>Library</span></div>
              <div class="omnia-side-item"><i data-lucide="shopping-bag" aria-hidden="true"></i><span>Discover</span></div>
              <div class="omnia-side-item omnia-side-active"><i data-lucide="settings" aria-hidden="true"></i><span>Settings</span></div>
            </aside>
            <main class="omnia-integrated">
              <div class="omnia-integrated-head"><strong>Settings</strong><span class="omnia-search"><i data-lucide="search" aria-hidden="true"></i>Search Settings</span></div>
              <div class="omnia-centered-pane">
                <p class="omnia-section-title">ACCOUNT</p>
                <div class="omnia-group">
                  <div class="omnia-row"><i data-lucide="user-round" aria-hidden="true"></i><span>Account</span><span class="omnia-summary">Not signed in</span><span class="omnia-chevron">›</span></div>
                </div>
                <p class="omnia-section-title" style="margin-top:12px">MEDIA</p>
                <div class="omnia-group">
                  <div class="omnia-row"><i data-lucide="puzzle" aria-hidden="true"></i><span>Add-ons</span><span class="omnia-summary">2 enabled</span><span class="omnia-chevron">›</span></div>
                  <div class="omnia-row"><i data-lucide="layers-3" aria-hidden="true"></i><span>Catalogs</span><span class="omnia-summary">Built-in + add-on</span><span class="omnia-chevron">›</span></div>
                  <div class="omnia-row"><i data-lucide="panels-top-left" aria-hidden="true"></i><span>Metadata</span><span class="omnia-summary">Providers</span><span class="omnia-chevron">›</span></div>
                </div>
              </div>
            </main>
          </div>
        </div>
      </div>
      <span class="omnia-choice-copy">
        <strong>B. Integrated centered pane</strong>
        <span>Keeps Settings in Omnia’s main sidebar, constrains content to a readable Mac width, and uses the existing native push/Back hierarchy.</span>
      </span>
    </button>
  </div>
</div>
